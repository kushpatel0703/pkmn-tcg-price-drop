<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokemon TCG Price Drops</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1c1f24; --muted: #5f6877; --line: #d9d6cc;
    --buy: #1f6f4a; --buy-soft: #e2f1e8; --wait: #8a5a00; --wait-soft: #f6ead0; --chip: #eeece5;
    --bad: #a3271f; --bad-soft: #fbe3e0; --track: #e6e3da;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171b; --card: #1d2127; --ink: #eceef1; --muted: #a2abb8; --line: #3a414b;
            --buy: #5fd39a; --buy-soft: #1d3a2c; --wait: #f0c26a; --wait-soft: #3a3020; --chip: #272c33;
            --bad: #ff9a8f; --bad-soft: #3d2220; --track: #2c323a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px 12px 60px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .stale { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 10px 12px; font-weight: 600; margin-bottom: 8px; }
  details.evidence { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; margin-bottom: 10px; font-size: 13.5px; }
  details.evidence summary { cursor: pointer; }
  details.evidence p { margin: 6px 0 0; color: var(--muted); }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .tab { min-height: 46px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; color: var(--ink); font: inherit; font-weight: 600; }
  .tab small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .tab[aria-selected="true"] { border-color: var(--buy); background: var(--buy-soft); }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .controls input[type="search"], .controls select { width: 100%; min-height: 44px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font: inherit; font-size: 16px; min-width: 0; }
  .full { grid-column: 1 / -1; }
  .hide { display: none !important; }
  details#setbox { background: var(--card); border: 1px solid var(--line); border-radius: 9px; }
  details#setbox summary { padding: 11px 10px; cursor: pointer; }
  .setactions { display: flex; gap: 6px; padding: 0 10px 8px; }
  button.small, .era button { min-height: 40px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  #setlist { max-height: 50vh; overflow-y: auto; padding: 0 10px 8px; border-top: 1px solid var(--line); }
  .era { display: flex; justify-content: space-between; align-items: center; font-weight: 650; font-size: 14px; margin: 10px 0 4px; }
  .setrow { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .setrow input { width: 22px; height: 22px; flex: none; accent-color: var(--buy); }
  .setrow span { flex: 1; overflow-wrap: anywhere; }
  .setrow small { color: var(--muted); font-size: 12.5px; }
  .focus { display: inline-flex; align-items: center; gap: 8px; background: var(--chip); border-radius: 999px; padding: 6px 6px 6px 12px; margin-bottom: 8px; font-size: 14px; }
  .focus button { border: none; background: var(--card); color: var(--ink); border-radius: 999px; width: 30px; height: 30px; font-size: 16px; cursor: pointer; }
  .summary { color: var(--muted); font-size: 13px; margin: 0 2px 8px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 7px; }
  .head { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; padding: 11px 12px; cursor: pointer; align-items: start; }
  .badge { display: inline-block; border-radius: 6px; padding: 2px 7px; font-size: 12px; font-weight: 700; letter-spacing: .02em; margin-top: 2px; }
  .badge.buy { background: var(--buy); color: var(--card); }
  .badge.wait { background: var(--wait-soft); color: var(--wait); }
  .badge.steady { background: var(--buy-soft); color: var(--buy); }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13px; }
  .price { text-align: right; white-space: nowrap; font-weight: 650; font-variant-numeric: tabular-nums; font-size: 16px; }
  .reason { grid-column: 2 / -1; font-size: 13.5px; }
  .reason.buy { color: var(--buy); } .reason.wait { color: var(--wait); }
  .detail { border-top: 1px solid var(--line); padding: 10px 12px 12px; font-size: 14px; }
  .detail p { margin: 5px 0; }
  .detail .muted { color: var(--muted); }
  .detail svg { width: 100%; height: 130px; display: block; margin: 2px 0 6px; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  a.btn, button.btn { display: inline-flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 9px; border: none; cursor: pointer;
    background: var(--buy); color: var(--card); text-decoration: none; font: inherit; font-weight: 650; }
  button.btn.alt { background: var(--chip); color: var(--ink); border: 1px solid var(--line); }
  table.groups { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; margin: 4px 0; }
  table.groups th, table.groups td { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line); }
  table.groups td.num, table.groups th.num { text-align: right; }
  textarea.copy { width: 100%; height: 140px; margin-top: 8px; font: 13px ui-monospace, monospace; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  button.more { width: 100%; min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; cursor: pointer; }
  footer { color: var(--muted); font-size: 12.5px; margin-top: 20px; }
  footer p { margin: 0 0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Pokemon TCG: buy or wait</h1>
  <div class="sub" id="sub"></div>
  <div id="stale"></div>
  <details class="evidence" id="evidence"><summary id="evsum"></summary><div id="evmore"></div></details>
  <div class="tabs" role="tablist">
    <button class="tab" type="button" role="tab" id="tab-sets">Sets<small id="tabsets-n"></small></button>
    <button class="tab" type="button" role="tab" id="tab-cards">Cards<small id="tabcards-n"></small></button>
  </div>
  <div class="controls">
    <details id="setbox" class="full">
      <summary id="setsum">My sets: all</summary>
      <div class="setactions"><button class="small" type="button" id="setall">Select all</button><button class="small" type="button" id="setnone">Clear all</button></div>
      <div id="setlist"></div>
    </details>
    <input id="q" class="full" type="search" placeholder="Search card, number or set" autocomplete="off" aria-label="Search">
    <select id="statef" aria-label="Show"></select>
    <select id="groupf" aria-label="Card group"></select>
    <select id="sort" class="full" aria-label="Sort"></select>
  </div>
  <div id="focus"></div>
  <div class="summary" id="summary"></div>
  <div id="list"></div>
  <footer id="foot"></footer>
</div>
<script>
const R = /*__REPORT__*/null;
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const money = (n) => "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money0 = (n) => "$" + Math.round(n).toLocaleString("en-US");
const fmtDate = (s, y) => s ? new Date(s + "T12:00:00").toLocaleDateString("en-US", y ? { month: "short", day: "numeric", year: "numeric" } : { month: "short", day: "numeric" }) : "";
const numKey = (n) => { const m = String(n || "").match(/\d+/); return m ? parseInt(m[0], 10) : 1e9; };
const pctS = (x) => (x > 0 ? "+" : "") + Math.round(x) + "%";
const GROUPS = { chase: "Chase", mid: "Mid", pattern: "Ball patterns", bulk: "Bulk" };
const store = { get(k, d) { try { const v = localStorage.getItem("pkmn-" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem("pkmn-" + k, JSON.stringify(v)); } catch (e) {} } };
let view = store.get("view", "sets"), shown = 50, open = null, focusSet = null;
const SORTS = { sets: [["buy", "Most to buy now"], ["new", "Newest set"], ["name", "Name"]],
                cards: [["auto", "Buy first, priciest first"], ["setnum", "Set, then card number"], ["dear", "Most expensive"], ["cheap", "Cheapest"]] };

function fill(sel, opts, val) { sel.textContent = ""; opts.forEach(([v, t]) => { const o = document.createElement("option"); o.value = v; o.textContent = t; sel.appendChild(o); }); if (val != null) sel.value = val; }

function init() {
  if (!R || !R.cards) { $("list").appendChild(el("div", "empty", "No report yet. The first daily run has not finished.")); return; }
  const mk = R.market_30d_pct;
  $("sub").textContent = "Prices for " + fmtDate(R.date, true) + (mk != null ? " · whole market " + pctS(mk) + " in 30 days" : "") + " · " + R.sets_tracked + " sets";
  const age = Math.floor((Date.now() - new Date(R.date + "T23:59:00Z").getTime()) / 864e5);
  if (age >= 2) $("stale").appendChild(el("div", "stale", "These prices are " + age + " days old: the daily update has stopped. Check the GitHub repo's Actions tab or open issues."));
  evidence();
  fill($("statef"), [["", "Buy and Wait"], ["Buy", "Buy only"], ["Wait", "Wait only"]], store.get("statef", ""));
  fill($("groupf"), [["", "All cards $1+"], ["chase", "Chase ($" + (R.chase_min || 20) + "+)"], ["mid", "Mid ($1–" + (R.chase_min || 20) + ")"], ["pattern", "Ball patterns"]], store.get("groupf", ""));
  ["statef", "groupf"].forEach((id) => $(id).addEventListener("input", () => { store.set(id, $(id).value); shown = 50; draw(); }));
  $("q").addEventListener("input", () => { shown = 50; draw(); });
  $("sort").addEventListener("input", () => { store.set("sort-" + view, $("sort").value); shown = 50; draw(); });
  $("tab-sets").addEventListener("click", () => { view = "sets"; store.set("view", view); shown = 50; open = null; draw(); });
  $("tab-cards").addEventListener("click", () => { view = "cards"; store.set("view", view); shown = 50; open = null; draw(); });
  buildSets();
  const f = $("foot");
  (R.caveats || []).forEach((c) => f.appendChild(el("p", null, c)));
  f.appendChild(el("p", null, "Prices from TCGplayer via tcgcsv.com, updated daily. Near Mint 1-year ranges from JustTCG (" + (R.nm_cards || 0).toLocaleString() + " cards so far). Price history on file since " + fmtDate(R.history_from, true) + "."));
  draw();
}

function evidence() {
  const ev = (R.evidence || {}).all || {};
  if (!ev.dates) { $("evsum").textContent = "Track record: still building while older price history loads."; return; }
  const b = ev.buy || {}, w = ev.wait || {};
  $("evsum").textContent = "Track record: cards marked Wait were " + Math.abs(Math.round(w.change_pct)) + "% " + (w.change_pct < 0 ? "cheaper" : "dearer") +
    " two months later; Buy cards " + Math.abs(Math.round(b.change_pct)) + "% " + (b.change_pct < 0 ? "cheaper" : "dearer") + ". ▾";
  const m = $("evmore");
  m.appendChild(el("p", null, "Buying on Buy (or after 60 days if a card never turned Buy) paid " + ev.overpay_following_pct + "% over each card's lowest price in those 60 days; buying straight away paid " + ev.overpay_buy_now_pct + "%."));
  m.appendChild(el("p", null, "Based on " + ev.dates + " weekly checks from " + fmtDate(ev.from, true) + " to " + fmtDate(ev.to, true) + ", while the whole market moved " + pctS(ev.market_change_pct) +
    " over each two months. Buy cards still got 5%+ cheaper " + b.cheaper5_pct + "% of the time and 5%+ dearer " + b.dearer5_pct + "%. Buy means waiting has saved little, not that the price can't dip."));
  const live = (R.evidence || {}).live || {};
  m.appendChild(el("p", null, live.dates ? "Since the rule was fixed (" + fmtDate(R.evidence.rule_since, true) + "): Wait " + pctS(live.wait.change_pct) + ", Buy " + pctS(live.buy.change_pct) + " over " + live.dates + " checks."
    : "Live results (checks after the rule was fixed on " + fmtDate(R.evidence.rule_since, true) + ") appear 60 days after that. Results update as older history loads."));
}

// ---- my sets (saved on this device when the browser allows it)
let ALL = [], picked = null;
function isPicked(n) { return !picked || picked.has(n); }
function savePicked() { store.set("sets", picked ? [...picked] : null); }
function setPicked(names, on) {
  if (!picked) picked = new Set(ALL.map((s) => s.name));
  names.forEach((n) => on ? picked.add(n) : picked.delete(n));
  if (picked.size === ALL.length) picked = null;
  savePicked(); syncSets(); shown = 50; draw();
}
function buildSets() {
  ALL = R.sets.slice();
  const saved = store.get("sets", null);
  if (Array.isArray(saved)) { const known = saved.filter((n) => ALL.some((s) => s.name === n)); if (known.length) picked = new Set(known); }
  const list = $("setlist"); list.textContent = "";
  const eras = []; ALL.forEach((s) => { if (!eras.includes(s.era)) eras.push(s.era); });
  eras.forEach((era) => {
    const members = ALL.filter((s) => s.era === era);
    const head = el("div", "era"); head.appendChild(el("span", null, era));
    const b = el("button", null, "All / none"); b.type = "button";
    b.addEventListener("click", () => setPicked(members.map((s) => s.name), !members.every((s) => isPicked(s.name))));
    head.appendChild(b); list.appendChild(head);
    members.forEach((s) => {
      const row = el("label", "setrow"); const cb = document.createElement("input"); cb.type = "checkbox"; cb.dataset.set = s.name;
      cb.addEventListener("change", () => setPicked([s.name], cb.checked));
      row.appendChild(cb); row.appendChild(el("span", null, s.name)); row.appendChild(el("small", null, (s.published || "").slice(0, 4)));
      list.appendChild(row);
    });
  });
  $("setall").addEventListener("click", () => { picked = null; savePicked(); syncSets(); shown = 50; draw(); });
  $("setnone").addEventListener("click", () => { picked = new Set(); savePicked(); syncSets(); shown = 50; draw(); });
  syncSets();
}
function syncSets() {
  $("setlist").querySelectorAll("input").forEach((cb) => { cb.checked = isPicked(cb.dataset.set); });
  $("setsum").textContent = "My sets: " + (!picked ? "all " + ALL.length : picked.size + " of " + ALL.length);
}

// ---- data selection
function words() { return $("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean); }
function cardRows() {
  const w = words(), sf = $("statef").value, gf = $("groupf").value;
  const rows = R.cards.filter((r) => (focusSet ? r.set === focusSet : isPicked(r.set)) && (!sf || r.state === sf) && (!gf || r.group === gf) &&
    (!w.length || w.every((x) => (r.name + " " + r.num + " #" + r.num + " " + r.set + " " + r.printing).toLowerCase().includes(x))));
  const s = $("sort").value || "auto";
  const flat = (r) => (r.hist_days >= 60 && r.high - r.low < 0.01 * r.high) ? 1 : 0;
  const by = { auto: (a, b) => (a.state !== "Buy") - (b.state !== "Buy") || flat(a) - flat(b) || b.price - a.price,
               setnum: (a, b) => a.set.localeCompare(b.set) || numKey(a.num) - numKey(b.num) || String(a.num).localeCompare(String(b.num)) || a.printing.localeCompare(b.printing),
               dear: (a, b) => b.price - a.price, cheap: (a, b) => a.price - b.price }[s] || ((a, b) => 0);
  return rows.sort(by);
}
function setRows() {
  const w = words();
  const rows = R.sets.filter((s) => isPicked(s.name) && (!w.length || w.every((x) => s.name.toLowerCase().includes(x))));
  const buyTotal = (s) => ["mid", "chase", "pattern"].reduce((t, g) => t + s.groups[g].buy_total, 0);
  const s = $("sort").value || "buy";
  const by = { buy: (a, b) => buyTotal(b) - buyTotal(a) || b.published.localeCompare(a.published),
               new: (a, b) => b.published.localeCompare(a.published), name: (a, b) => a.name.localeCompare(b.name) }[s];
  return rows.sort(by);
}

// ---- drawing
function draw() {
  $("tab-sets").setAttribute("aria-selected", String(view === "sets"));
  $("tab-cards").setAttribute("aria-selected", String(view === "cards"));
  fill($("sort"), SORTS[view], store.get("sort-" + view, SORTS[view][0][0]));
  if (!$("sort").value) $("sort").value = SORTS[view][0][0];
  ["statef", "groupf"].forEach((id) => $(id).classList.toggle("hide", view !== "cards"));
  const cr = cardRows(), sr = setRows();
  $("tabsets-n").textContent = sr.length + " sets";
  const buyN = cr.filter((r) => r.state === "Buy").length;
  $("tabcards-n").textContent = buyN.toLocaleString() + " Buy · " + (cr.length - buyN).toLocaleString() + " Wait";
  const fc = $("focus"); fc.textContent = "";
  if (focusSet && view === "cards") {
    const chip = el("div", "focus"); chip.appendChild(el("span", null, "Showing " + focusSet));
    const x = el("button", null, "✕"); x.type = "button"; x.setAttribute("aria-label", "Show my sets again");
    x.addEventListener("click", () => { focusSet = null; shown = 50; draw(); }); chip.appendChild(x); fc.appendChild(chip);
  }
  const list = $("list"); list.textContent = "";
  if (view === "sets") drawSets(sr, list); else drawCards(cr, list);
}

function drawSets(rows, list) {
  const nBuy = rows.reduce((t, s) => t + ["mid", "chase", "pattern"].reduce((u, g) => u + s.groups[g].buy_n, 0), 0);
  $("summary").textContent = nBuy.toLocaleString() + " cards across these sets are Buy today. Bulk (under $1) is always fine to buy in one order.";
  if (!rows.length) { list.appendChild(el("div", "empty", "No sets selected.")); return; }
  rows.forEach((s) => list.appendChild(setItem(s)));
}

function setBadge(s) {
  if (s.new) return ["wait", "New set"];
  if (s.falling) return ["wait", "Falling " + pctS(s.chg8w) + " / 8 wks"];
  if (s.chg8w == null) return ["steady", "Too few cards to judge"];
  return ["steady", "Steady " + pctS(s.chg8w) + " / 8 wks"];
}

function setItem(s) {
  const g = s.groups, item = el("div", "item"), head = el("div", "head"); head.setAttribute("role", "button"); head.tabIndex = 0;
  const [cls, txt] = setBadge(s);
  head.appendChild(el("span", "badge " + cls, cls === "wait" ? "WAIT" : "OK"));
  const mid = el("div"); mid.appendChild(el("div", "name", s.name)); mid.appendChild(el("div", "meta", (s.published || "").slice(0, 4) + " · " + txt + (s.changed ? " · " + s.changed + " today" : "")));
  head.appendChild(mid);
  const buyN = g.mid.buy_n + g.chase.buy_n + g.pattern.buy_n, buyT = g.mid.buy_total + g.chase.buy_total + g.pattern.buy_total;
  const waitN = g.mid.wait_n + g.chase.wait_n + g.pattern.wait_n, waitT = g.mid.wait_total + g.chase.wait_total + g.pattern.wait_total;
  head.appendChild(el("div", "price", money0(buyT + waitT + g.bulk.total)));
  head.appendChild(el("div", "reason " + (buyN ? "buy" : "wait"), "Buy now: " + buyN + " cards · " + money0(buyT) + "   ·   Wait: " + waitN + " · " + money0(waitT)));
  if (g.bulk.n) head.appendChild(el("div", "reason muted", "Bulk: " + g.bulk.n + " printings under $1 · about " + money0(g.bulk.total) + (g.bulk.floor - g.bulk.total >= 1 ? "–" + money0(g.bulk.floor) : "") + " · buy any time, in one order"));
  const toggle = () => { open = open === "set:" + s.name ? null : "set:" + s.name; draw(); };
  head.addEventListener("click", toggle); head.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
  item.appendChild(head);
  if (open === "set:" + s.name) item.appendChild(setDetail(s));
  return item;
}

function setDetail(s) {
  const d = el("div", "detail"), g = s.groups;
  const why = s.new ? "This set came out " + fmtDate(s.published, true) + ". New sets usually keep falling for months; its cards turn Buy once it is 6 months old and steady."
    : s.falling ? "The typical card in this set is " + pctS(s.chg8w) + " over 8 weeks. Cards turn Buy once that recovers above −1% and nothing else flags for a week."
    : "The set is steady. Cards still marked Wait are dropping or jumping on their own.";
  d.appendChild(el("p", null, why));
  const t = el("table", "groups"), hr = el("tr");
  ["Group", "Cards", "Buy now", "Wait"].forEach((h, i) => hr.appendChild(el("th", i ? "num" : null, h))); t.appendChild(hr);
  ["chase", "mid", "pattern"].forEach((k) => {
    if (!g[k].n) return;
    const tr = el("tr");
    tr.appendChild(el("td", null, GROUPS[k] + (k === "chase" ? " ($" + (R.chase_min || 20) + "+)" : k === "mid" ? " ($1–" + (R.chase_min || 20) + ")" : "")));
    tr.appendChild(el("td", "num", String(g[k].n)));
    tr.appendChild(el("td", "num", g[k].buy_n + " · " + money0(g[k].buy_total)));
    tr.appendChild(el("td", "num", g[k].wait_n + " · " + money0(g[k].wait_total)));
    t.appendChild(tr);
  });
  if (g.bulk.n) { const tr = el("tr"); tr.appendChild(el("td", null, "Bulk (under $1)")); tr.appendChild(el("td", "num", String(g.bulk.n)));
    const c = el("td", "num", "any time · " + money0(g.bulk.total) + "–" + money0(g.bulk.floor)); c.colSpan = 2; tr.appendChild(c); t.appendChild(tr); }
  d.appendChild(t);
  if (g.pattern.n) d.appendChild(el("p", "muted", "Ball patterns under $1 are counted in the pattern row, not bulk."));
  if (g.bulk.n) d.appendChild(el("p", "muted", "Bulk range: market price total, and the total if every card sells at TCGplayer Direct's $0.40 minimum. One combined order keeps shipping down."));
  if (s.box) d.appendChild(el("p", "muted", s.box[0] + ": " + money(s.box[1]) + " (for comparison with buying singles)."));
  const btns = el("div", "btnrow");
  const show = el("button", "btn", "Show cards"); show.type = "button";
  show.addEventListener("click", () => { focusSet = s.name; view = "cards"; store.set("view", view); shown = 50; open = null; draw(); });
  btns.appendChild(show);
  const buyCards = R.cards.filter((r) => r.set === s.name && r.state === "Buy");
  if (buyCards.length) btns.appendChild(copyButton("Copy Buy list (" + buyCards.length + ")", () => massEntry(buyCards.map((r) => [r.name, r.num]), s.abbr), d));
  if (s.bulk_list && s.bulk_list.length) btns.appendChild(copyButton("Copy bulk list (" + s.bulk_list.length + ")", () => massEntry(s.bulk_list, s.abbr), d));
  d.appendChild(btns);
  return d;
}

function massEntry(pairs, abbr) {
  const seen = new Set(), lines = [];
  pairs.forEach(([name, num]) => {
    const n = String(name).replace(/\s+-\s+[A-Za-z0-9/]+$/, "");
    const no = String(num || "").split("/")[0];
    const line = "1 " + n + (abbr ? " [" + abbr + "]" : "") + (no ? " " + no : "");
    if (!seen.has(line)) { seen.add(line); lines.push(line); }
  });
  return lines.join("\n");
}

function copyButton(label, text, host) {
  const b = el("button", "btn alt", label); b.type = "button";
  b.addEventListener("click", () => {
    const t = text();
    const show = () => {
      const ta = el("textarea", "copy"); ta.value = t; ta.readOnly = true; host.appendChild(ta);
      host.appendChild(el("p", "muted", "Copy this list, paste it into TCGplayer's Mass Entry, choose Near Mint and the printing there, then let the cart optimizer cut shipping."));
      try { ta.select(); } catch (e) {}
    };
    try {
      navigator.clipboard.writeText(t).then(() => { b.textContent = "Copied: paste into TCGplayer Mass Entry"; }, show);
    } catch (e) { show(); }
  });
  return b;
}

function drawCards(rows, list) {
  const buy = rows.filter((r) => r.state === "Buy"), newly = rows.filter((r) => r.newly_buy).length;
  $("summary").textContent = buy.length.toLocaleString() + " Buy (" + money0(buy.reduce((t, r) => t + r.price, 0)) + ") · " + (rows.length - buy.length).toLocaleString() + " Wait" +
    (newly ? " · " + newly + " turned Buy today" : "") + ". Cards under $1 are in each set's bulk list.";
  if (!rows.length) { list.appendChild(el("div", "empty", focusSet ? "No cards worth $1+ in this set yet." : "Nothing here with these filters.")); return; }
  rows.slice(0, shown).forEach((r) => list.appendChild(cardItem(r)));
  if (rows.length > shown) { const b = el("button", "more", "Show more (" + (rows.length - shown) + " left)"); b.type = "button";
    b.addEventListener("click", () => { shown += 50; draw(); }); list.appendChild(b); }
}

function cardItem(r) {
  const item = el("div", "item"), head = el("div", "head"); head.setAttribute("role", "button"); head.tabIndex = 0;
  const buy = r.state === "Buy";
  head.appendChild(el("span", "badge " + (buy ? "buy" : "wait"), buy ? "BUY" : "WAIT"));
  const mid = el("div"); mid.appendChild(el("div", "name", r.name));
  mid.appendChild(el("div", "meta", [r.set, r.num ? "#" + r.num : "", r.printing].filter(Boolean).join(" · "))); head.appendChild(mid);
  head.appendChild(el("div", "price", money(r.price)));
  const flat = r.hist_days >= 60 && r.high - r.low < 0.01 * r.high;
  head.appendChild(el("div", "reason " + (buy ? "buy" : "wait"), r.reason + (flat ? " · few sales" : "") + (r.newly_buy ? " · new today" : "") + (r.price < 5 ? " · cheap: add to a bulk order" : "")));
  const key = r.id + "|" + r.printing;
  const toggle = () => { open = open === key ? null : key; draw(); };
  head.addEventListener("click", toggle); head.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
  item.appendChild(head);
  if (open === key) item.appendChild(cardDetail(r, flat));
  return item;
}

function cardDetail(r, flat) {
  const d = el("div", "detail"), buy = r.state === "Buy";
  d.appendChild(el("p", null, buy ? "Buy: nothing has flagged this card for " + r.reason.replace("steady ", "") + ". On cards like this, waiting has saved little."
    : "Wait: " + r.reason + ". " + untilText(r)));
  d.appendChild(chart(r));
  const span = r.hist_days >= 330 ? "Past year" : "Since " + fmtDate(r.spark_from || R.history_from, true);
  d.appendChild(el("p", null, span + ": low " + money(r.low) + " (" + fmtDate(r.low_on) + ") · high " + money(r.high) + " (" + fmtDate(r.high_on) + ")" +
    (r.chg4w != null ? " · 4 weeks " + pctS(r.chg4w) : "")));
  if (r.nm_low1y != null && r.nm_low1y >= 0.4 * r.price) {
    let t = "Near Mint over the past year (JustTCG): " + money(r.nm_low1y) + " – " + money(r.nm_high1y) + ".";
    if (r.hist_days < 330 && r.nm_low1y < 0.8 * r.low) t += " It was much cheaper earlier this year, before our price history starts.";
    d.appendChild(el("p", "muted", t));
  }
  if (flat) d.appendChild(el("p", "muted", "The price has barely moved for " + r.hist_days + " days, which usually means few sales. Check recent sales on TCGplayer."));
  if (r.price < 5) d.appendChild(el("p", "muted", "Under $5, an extra order's shipping ($1.31–$3.99) can cost more than waiting would save, so add it to a bigger order."));
  const btns = el("div", "btnrow");
  const a = el("a", "btn", "Open on TCGplayer"); a.href = "https://www.tcgplayer.com/product/" + encodeURIComponent(r.id); a.target = "_blank"; a.rel = "noopener";
  btns.appendChild(a); d.appendChild(btns);
  d.appendChild(el("p", "muted", "Market price is TCGplayer's recent-sales figure for this printing; pick Near Mint and " + r.printing + " on TCGplayer."));
  return d;
}

function untilText(r) {
  if (r.reason.indexOf("New set") === 0) return "It turns Buy once the set is 6 months old and steady.";
  if (r.reason.indexOf("Set falling") === 0) return "It turns Buy once the set's 8-week change recovers above −1% and nothing else flags for a week.";
  if (r.reason.indexOf("Just listed") === 0) return "It turns Buy 45 days after it was first priced, if steady.";
  if (r.reason.indexOf("Settling") === 0) return "It turns Buy after 7 days without a warning.";
  return "It turns Buy once the price holds for a week.";
}

function chart(r) {
  const NS = "http://www.w3.org/2000/svg", W = 320, H = 130, L = 6, Rr = 6, T = 14, B = 18;
  const svg = document.createElementNS(NS, "svg"); svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Price history since " + fmtDate(r.spark_from, true));
  const pts = (r.spark || []).map((v, i) => [i, v]).filter((p) => p[1] != null);
  if (pts.length < 2) return svg;
  const vals = pts.map((p) => p[1]), lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), span = Math.max(hi - lo, 0.01), n = r.spark.length - 1;
  const x = (i) => L + i / n * (W - L - Rr), y = (v) => T + (1 - (v - lo) / span) * (H - T - B);
  let cs = null; try { cs = getComputedStyle(document.documentElement); } catch (e) {}
  const col = (v, f) => (cs && cs.getPropertyValue(v).trim()) || f;
  const txt = (xx, yy, s, anchor, c) => { const t = document.createElementNS(NS, "text"); t.setAttribute("x", xx); t.setAttribute("y", yy); t.setAttribute("font-size", "11");
    t.setAttribute("text-anchor", anchor); t.setAttribute("fill", c); t.textContent = s; svg.appendChild(t); };
  const line = document.createElementNS(NS, "polyline");
  line.setAttribute("points", pts.map((p) => x(p[0]).toFixed(1) + "," + y(p[1]).toFixed(1)).join(" "));
  line.setAttribute("fill", "none"); line.setAttribute("stroke", col("--ink", "#1c1f24")); line.setAttribute("stroke-width", "2"); svg.appendChild(line);
  const dot = document.createElementNS(NS, "circle"); const lp = pts[pts.length - 1];
  dot.setAttribute("cx", x(lp[0])); dot.setAttribute("cy", y(lp[1])); dot.setAttribute("r", "4"); dot.setAttribute("fill", col(r.state === "Buy" ? "--buy" : "--wait", "#1f6f4a")); svg.appendChild(dot);
  const muted = col("--muted", "#5f6877");
  txt(L, 11, money(hi), "start", muted); txt(L, H - 22, money(lo), "start", muted);
  txt(L, H - 4, fmtDate(r.spark_from, true), "start", muted); txt(W - Rr, H - 4, "today", "end", muted);
  return svg;
}
init();
</script>
</body>

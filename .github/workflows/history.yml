name: Load price history (one-time)

# Loads tcgcsv's daily price archives back to their start (Feb 2024): one
# archive about every 15 seconds, saving progress every 60 archives. If tcgcsv
# asks us to slow down, or anything fails, the loop waits and carries on; if the
# whole job dies, the hourly schedule starts it again where it left off. Once
# nothing is left, each run finishes in about a minute and this workflow can be
# disabled.

on:
  schedule:
    - cron: "23 * * * *"   # hourly restart; a run already in progress keeps going
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-price-drops      # shared with the daily run so they never overlap
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Make sure 7z is available
        run: which 7z || (sudo apt-get update && sudo apt-get install -y p7zip-full)
      - name: Load history in chunks, saving after each
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVES_PER_RUN: "60"
          TCGCSV_ARCHIVE_PAUSE: "15"
        run: |
          git config user.name "price-drop-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          start=$(date +%s)
          save() {
            git add data
            git diff --cached --quiet && return 0
            git commit -q -m "Price history from archives"
            for i in 1 2 3; do
              git pull -q --rebase "$remote" main && git push -q "$remote" HEAD:main && return 0
              git rebase --abort 2>/dev/null || true; sleep 10
            done
            return 1
          }
          while [ $(( $(date +%s) - start )) -lt 19800 ]; do      # stop after 5.5 hours
            out=$(python3 tracker/track.py --history-only 2>&1) ; code=$?
            echo "$out" | grep -E "history|FAILED|Error|Traceback" | tail -20
            save || echo "could not save this chunk; will retry"
            if echo "$out" | grep -q "slow down\|stopping at"; then
              echo "paused by tcgcsv or an error; waiting 10 minutes"; sleep 600; continue
            fi
            if [ $code -ne 0 ]; then echo "chunk failed; waiting 5 minutes"; sleep 300; continue; fi
            echo "$out" | grep -q "^history: [0-9]* missing days" || { echo "nothing left to load"; break; }
          done

name: Dex probe (temporary)
on: workflow_dispatch
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://clients.dextcg.com/api/users/kushp1/profile https://clients.dextcg.com/api/users/f2e5e81b-1188-41c4-b3bf-e65189f5f3d3/cards https://clients.dextcg.com/api/users/f2e5e81b-1188-41c4-b3bf-e65189f5f3d3/sets; do
            echo "== $u"; curl -sS -m 30 -o body -w "status %{http_code} bytes %{size_download}\n" -H "Accept: application/json" "$u"; head -c 700 body; echo
          done
